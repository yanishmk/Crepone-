name: Vérification build (temporaire)
on:
  push:
    branches: [nouveau-design]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
        continue-on-error: true
      - run: npm run build
